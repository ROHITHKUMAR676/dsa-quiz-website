<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="intellexa-favicon" rel="icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#161925" />
    <script>
      try {
        const theme = localStorage.getItem("intellexa-theme") === "light" ? "light" : "dark";
        document.documentElement.classList.toggle("theme-light", theme === "light");
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      } catch {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <title>Intellexa · WebDev × DSA Arena</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
